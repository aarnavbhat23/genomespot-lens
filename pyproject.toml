[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genomespot-lens"
version = "0.2.0"
description = "GenomeSPOT physiology audits and ecology, evolution and AMR analyses of encrypted AMP catalogs"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
dependencies = ["numpy==1.24.4", "scipy==1.10.1", "scikit-learn==1.2.2", "hmmlearn==0.3.0", "biopython==1.83", "pandas==2.0.3", "joblib==1.3.2", "bacdive==0.3.1"]

[project.optional-dependencies]
test = ["pytest==7.4.3"]
pilot = ["pyrodigal==3.6.3"]
plot = ["matplotlib==3.7.4", "contourpy==1.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires upstream checkout and models"]
